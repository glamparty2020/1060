<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Schedule Board</title>

  <style>
    /* 기존 스타일 있으면 그대로 두고 여기에 추가 가능 */
  </style>
</head>

<body>

<div id="cards"></div>
<div id="toast"></div>

<script type="module">

/* =========================
   1. Firebase import
========================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

/* =========================
   2. Firebase config
========================= */
const firebaseConfig = {
  apiKey: "AIzaSyCPlvKL8-4W8a5X7HoIXlTlYcrIiJvGuiY",
  authDomain: "project-6646559495435789897.firebaseapp.com",
  projectId: "project-6646559495435789897",
  storageBucket: "project-6646559495435789897.firebasestorage.app",
  messagingSenderId: "973490513763",
  appId: "1:973490513763:web:93fc9b0908df57e72dd556"
};

/* =========================
   3. Init Firebase
========================= */
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ref = doc(db, "board", "assignments");

/* =========================
   4. DATA (여기 필요하면 수정)
========================= */
const tenants = ["Alice", "Bob", "Charlie"];

// 예시 rows (너 기존 것 유지 가능)
const rows = [
  { date: "Jun 01", dn: 1, black: true },
  { date: "Jun 02", dn: 2, black: false },
  { date: "Jun 03", dn: 3, black: true }
];

/* =========================
   5. LOAD / SAVE
========================= */
async function loadData() {
  const snap = await getDoc(ref);
  if (snap.exists()) return snap.data();
  return {};
}

async function saveData(data) {
  await setDoc(ref, data);
}

/* =========================
   6. UI helpers
========================= */
function av(v) {
  return `<span class="tag">${v}</span>`;
}

function opts(k, saved) {
  return ['', ...tenants].map(t =>
    `<option value="${t}" ${saved[k] === t ? 'selected' : ''}>
      ${t || '— unassigned —'}
    </option>`
  ).join('');
}

/* =========================
   7. TOAST
========================= */
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* =========================
   8. RENDER
========================= */
async function render() {
  const saved = await loadData();

  let html = "";

  rows.forEach((r, i) => {
    const pk = `put_${i}`;
    const bk = `bring_${i}`;

    html += `
      <div class="card">
        <h3>${r.date}</h3>

        <div>
          Put:
          <select data-k="${pk}" onchange="window.onChange()">
            ${opts(pk, saved)}
          </select>
        </div>

        <div>
          Bring:
          <select data-k="${bk}" onchange="window.onChange()">
            ${opts(bk, saved)}
          </select>
        </div>
      </div>
    `;
  });

  document.getElementById("cards").innerHTML = html;
}

/* =========================
   9. CHANGE HANDLER
========================= */
window.onChange = async function () {
  const selects = document.querySelectorAll("select");

  const data = {};
  selects.forEach(s => {
    data[s.dataset.k] = s.value;
  });

  await saveData(data);
  toast("Saved");
  render();
};

/* =========================
   10. INIT
========================= */
render();

</script>
</body>
</html>
